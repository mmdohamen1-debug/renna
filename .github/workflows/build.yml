          cat > deploy-worker.sh <<'RENNA_EOF'
          #!/usr/bin/env bash
          # Deploys the Renna server to Cloudflare Workers (free) and prints its URL into GITHUB_ENV.
          set -euo pipefail
          export WRANGLER_SEND_METRICS=false
          API=https://api.cloudflare.com/client/v4
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          ACC=$(curl -sf -H "$H" "$API/accounts" | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')" || true)
          if [ -z "$ACC" ]; then
            echo "::error::تعذّر قراءة حساب Cloudflare. أعد إنشاء التوكن بقالب Edit Cloudflare Workers"
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID="$ACC"

          # make sure the account has a workers.dev subdomain
          SUB=$(curl -sf -H "$H" "$API/accounts/$ACC/workers/subdomain" | python3 -c "import sys,json; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')" || true)
          if [ -z "$SUB" ]; then
            NEW="renna-$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            curl -sf -X PUT -H "$H" -H "Content-Type: application/json" -d "{\"subdomain\":\"$NEW\"}" "$API/accounts/$ACC/workers/subdomain" >/dev/null || true
          fi

          cd worker
          find_ns() {
            wrangler kv namespace list 2>/dev/null | python3 -c "import sys,json; l=json.load(sys.stdin); print(next((n['id'] for n in l if n['title']=='renna-codes'),''))"
          }
          KV=$(find_ns || true)
          if [ -z "$KV" ]; then
            wrangler kv namespace create renna-codes || true
            KV=$(find_ns || true)
          fi
          if [ -z "$KV" ]; then
            echo "::error::تعذّر إنشاء قاعدة البيانات (KV) في Cloudflare. تأكد أن التوكن يملك صلاحية Workers KV Storage"
            exit 1
          fi

          cat > wrangler.toml <<TOML
          name = "renna"
          main = "worker.js"
          compatibility_date = "2024-11-01"

          [[kv_namespaces]]
          binding = "RENNA"
          id = "$KV"
          TOML

          wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then
            echo "::error::تم النشر لكن لم أجد رابط الخادم. راجع سجل الخطوة"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | wrangler secret put FIREBASE_SERVICE_ACCOUNT

          ok=0
          for i in $(seq 1 12); do
            if curl -sf "$URL" >/dev/null; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] && echo "Server is up: $URL" || echo "::warning::الخادم لم يستجب بعد (قد يحتاج دقائق): $URL"
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
          RENNA_EOF
          cat > gradle.properties <<'RENNA_EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          kotlin.code.style=official
          RENNA_EOF
          cat > settings.gradle.kts <<'RENNA_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Renna"
          include(":app")
          RENNA_EOF
          mkdir -p worker
          cat > worker/worker.js <<'RENNA_EOF'
          // Renna server - Cloudflare Worker (free tier) + KV namespace bound as RENNA
          // Secret needed: FIREBASE_SERVICE_ACCOUNT (full JSON of the Firebase service account key)

          const json = (o, s = 200) =>
            new Response(JSON.stringify(o), { status: s, headers: { "content-type": "application/json" } });

          const b64url = (buf) =>
            btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

          let cached = { token: null, exp: 0 };

          async function accessToken(sa) {
            const now = Math.floor(Date.now() / 1000);
            if (cached.token && cached.exp - 60 > now) return cached.token;
            const enc = new TextEncoder();
            const header = b64url(enc.encode(JSON.stringify({ alg: "RS256", typ: "JWT" })));
            const claim = b64url(
              enc.encode(
                JSON.stringify({
                  iss: sa.client_email,
                  scope: "https://www.googleapis.com/auth/firebase.messaging",
                  aud: "https://oauth2.googleapis.com/token",
                  iat: now,
                  exp: now + 3600,
                })
              )
            );
            const pem = sa.private_key.replace(/-----[^-]+-----/g, "").replace(/\s+/g, "");
            const der = Uint8Array.from(atob(pem), (c) => c.charCodeAt(0));
            const key = await crypto.subtle.importKey(
              "pkcs8",
              der,
              { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" },
              false,
              ["sign"]
            );
            const sig = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", key, enc.encode(`${header}.${claim}`));
            const jwt = `${header}.${claim}.${b64url(sig)}`;
            const r = await fetch("https://oauth2.googleapis.com/token", {
              method: "POST",
              headers: { "content-type": "application/x-www-form-urlencoded" },
              body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`,
            });
            const d = await r.json();
            if (!d.access_token) throw new Error("oauth failed");
            cached = { token: d.access_token, exp: now + (d.expires_in || 3600) };
            return cached.token;
          }

          function newCode() {
            const a = new Uint32Array(1);
            crypto.getRandomValues(a);
            return String(10000000 + (a[0] % 90000000));
          }

          async function handleRegister(req, env) {
            const { code, secret, token } = await req.json();
            if (!token || typeof token !== "string") return json({ error: "bad_request" }, 400);

            if (code && secret && /^\d{8}$/.test(code)) {
              const existing = await env.RENNA.get("c:" + code, "json");
              if (existing && existing.secret !== secret) return json({ error: "forbidden" }, 403);
              await env.RENNA.put("c:" + code, JSON.stringify({ token, secret }));
              return json({ code, secret });
            }

            for (let i = 0; i < 10; i++) {
              const c = newCode();
              if (await env.RENNA.get("c:" + c)) continue;
              const s = crypto.randomUUID().replace(/-/g, "");
              await env.RENNA.put("c:" + c, JSON.stringify({ token, secret: s }));
              return json({ code: c, secret: s });
            }
            return json({ error: "busy" }, 503);
          }

          async function handleRing(req, env) {
            const { code } = await req.json();
            if (!code || !/^\d{8}$/.test(code)) return json({ error: "bad_code" }, 400);
            const rec = await env.RENNA.get("c:" + code, "json");
            if (!rec) return json({ error: "not_found" }, 404);

            const last = await env.RENNA.get("r:" + code);
            if (last && Date.now() - Number(last) < 5000) return json({ error: "slow_down" }, 429);
            await env.RENNA.put("r:" + code, String(Date.now()), { expirationTtl: 60 });

            const sa = JSON.parse(env.FIREBASE_SERVICE_ACCOUNT);
            const at = await accessToken(sa);
            const r = await fetch(`https://fcm.googleapis.com/v1/projects/${sa.project_id}/messages:send`, {
              method: "POST",
              headers: { Authorization: `Bearer ${at}`, "content-type": "application/json" },
              body: JSON.stringify({
                message: {
                  token: rec.token,
                  data: { type: "ring" },
                  android: { priority: "HIGH", ttl: "60s" },
                },
              }),
            });
            if (r.ok) return json({ ok: true });
            if (r.status === 404) {
              await env.RENNA.delete("c:" + code);
              return json({ error: "gone" }, 410);
            }
            return json({ error: "fcm_failed", status: r.status }, 502);
          }

          export default {
            async fetch(req, env) {
              if (req.method !== "POST") return json({ name: "renna", ok: true });
              const path = new URL(req.url).pathname;
              try {
                if (path === "/register") return await handleRegister(req, env);
                if (path === "/ring") return await handleRing(req, env);
                return json({ error: "not_found" }, 404);
              } catch (e) {
                return json({ error: "server_error" }, 500);
              }
            },
          };
          RENNA_EOF

      - name: Deploy server to Cloudflare
        working-directory: renna
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm i -g wrangler@4
          bash deploy-worker.sh
      - name: Add google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GS" > renna/app/google-services.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: renna
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp renna/app/build/outputs/apk/debug/app-debug.apk Renna.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Renna APK ${{ github.run_number }}
          files: Renna.apk
