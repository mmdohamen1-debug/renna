          package com.renna.app

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import androidx.core.app.NotificationCompat

          object Notifier {
              private const val CHANNEL_ID = "renna_ring_v1"

              fun ensureChannel(ctx: Context) {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  if (nm.getNotificationChannel(CHANNEL_ID) != null) return
                  val ch = NotificationChannel(CHANNEL_ID, ctx.getString(R.string.channel_name), NotificationManager.IMPORTANCE_HIGH)
                  ch.description = ctx.getString(R.string.channel_desc)
                  ch.enableVibration(true)
                  ch.vibrationPattern = longArrayOf(0, 700, 300, 700, 300, 700)
                  ch.lockscreenVisibility = android.app.Notification.VISIBILITY_PUBLIC
                  val attrs = AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                      .build()
                  ch.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), attrs)
                  nm.createNotificationChannel(ch)
              }

              fun show(ctx: Context) {
                  ensureChannel(ctx)
                  val open = PendingIntent.getActivity(
                      ctx, 0, Intent(ctx, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n = NotificationCompat.Builder(ctx, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_notification)
                      .setContentTitle(ctx.getString(R.string.ring_title))
                      .setContentText(ctx.getString(R.string.ring_text))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setAutoCancel(true)
                      .setContentIntent(open)
                      .build()
                  try {
                      ctx.getSystemService(NotificationManager::class.java).notify(1001, n)
                  } catch (_: SecurityException) { }
              }
          }
