name: Build Renna APK
# Run manually from the Actions tab. Deploys the server to Cloudflare, then builds the APK and publishes it in Releases.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$GS" ] || fail "Missing secret GOOGLE_SERVICES_JSON"
          [ -n "$SA" ] || fail "Missing secret FIREBASE_SERVICE_ACCOUNT"
          [ -n "$CF" ] || fail "Missing secret CLOUDFLARE_API_TOKEN"
          echo "$GS" | grep -q '"com.renna.app"' || fail "google-services.json does not contain package name com.renna.app"
          echo "$SA" | grep -q '"private_key"' || fail "FIREBASE_SERVICE_ACCOUNT is not a valid service account key"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate project files
        run: |
          mkdir renna && cd renna
          mkdir -p app
          cat > app/build.gradle.kts <<'RENNA_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.renna.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.renna.app"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  buildConfigField("String", "SERVER_URL", "\"${System.getenv("WORKER_URL") ?: ""}\"")
              }
              buildFeatures { buildConfig = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation(platform("com.google.firebase:firebase-bom:33.1.2"))
              implementation("com.google.firebase:firebase-messaging-ktx")
          }
          RENNA_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'RENNA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Renna">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RennaService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          RENNA_EOF
          mkdir -p app/src/main/java/com/renna/app
          cat > app/src/main/java/com/renna/app/Api.kt <<'RENNA_EOF'
          package com.renna.app

          import android.content.Context
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object Api {
              private fun post(path: String, body: JSONObject): Pair<Int, JSONObject?> {
                  val conn = URL(BuildConfig.SERVER_URL.trimEnd('/') + path).openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 15000
                      conn.readTimeout = 15000
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }
                      val status = conn.responseCode
                      val stream = if (status in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      val json = try { JSONObject(text) } catch (e: Exception) { null }
                      return Pair(status, json)
                  } finally {
                      conn.disconnect()
                  }
              }

              /** Registers this phone's FCM token. Returns the permanent 8-digit code, or null on failure. */
              fun register(ctx: Context, token: String, retry: Boolean = true): String? {
                  val p = ctx.getSharedPreferences("renna", Context.MODE_PRIVATE)
                  val body = JSONObject().put("token", token)
                  p.getString("code", null)?.let { body.put("code", it) }
                  p.getString("secret", null)?.let { body.put("secret", it) }
                  val (status, json) = post("/register", body)
                  if (status == 200 && json != null) {
                      val code = json.getString("code")
                      p.edit().putString("code", code)
                          .putString("secret", json.getString("secret"))
                          .putString("token", token).apply()
                      return code
                  }
                  if (status == 403 && retry) {
                      p.edit().remove("code").remove("secret").apply()
                      return register(ctx, token, false)
                  }
                  return null
              }

              fun ring(code: String): Int = post("/ring", JSONObject().put("code", code)).first
          }
          RENNA_EOF
          mkdir -p app/src/main/java/com/renna/app
          cat > app/src/main/java/com/renna/app/MainActivity.kt <<'RENNA_EOF'
          package com.renna.app

          import android.Manifest
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.google.android.material.button.MaterialButton
          import com.google.firebase.messaging.FirebaseMessaging

          class MainActivity : AppCompatActivity() {
              private lateinit var tvCode: TextView
              private lateinit var tvStatus: TextView
              private lateinit var etInput: EditText
              private lateinit var btnRing: MaterialButton

              private val prefs get() = getSharedPreferences("renna", Context.MODE_PRIVATE)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  Notifier.ensureChannel(this)

                  tvCode = findViewById(R.id.tvCode)
                  tvStatus = findViewById(R.id.tvStatus)
                  etInput = findViewById(R.id.etInput)
                  btnRing = findViewById(R.id.btnRing)

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  findViewById<MaterialButton>(R.id.btnCopy).setOnClickListener {
                      val code = prefs.getString("code", null) ?: return@setOnClickListener
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("renna", code))
                      Toast.makeText(this, R.string.copied, Toast.LENGTH_SHORT).show()
                  }
                  findViewById<MaterialButton>(R.id.btnShare).setOnClickListener {
                      val code = prefs.getString("code", null) ?: return@setOnClickListener
                      val i = Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_TEXT, getString(R.string.share_text, code))
                      }
                      startActivity(Intent.createChooser(i, getString(R.string.share)))
                  }
                  btnRing.setOnClickListener { sendRing() }
              }

              override fun onResume() {
                  super.onResume()
                  showCode(prefs.getString("code", null))
                  registerThisPhone()
              }

              private fun showCode(code: String?) {
                  tvCode.text = code ?: getString(R.string.creating_code)
              }

              private fun registerThisPhone() {
                  FirebaseMessaging.getInstance().token
                      .addOnSuccessListener { token ->
                          Thread {
                              val code = try { Api.register(applicationContext, token) } catch (_: Exception) { null }
                              runOnUiThread {
                                  if (code != null) {
                                      showCode(code)
                                  } else if (prefs.getString("code", null) == null) {
                                      tvCode.text = getString(R.string.code_failed)
                                  }
                              }
                          }.start()
                      }
                      .addOnFailureListener {
                          if (prefs.getString("code", null) == null) {
                              tvCode.text = getString(R.string.code_failed)
                          }
                      }
              }

              private fun sendRing() {
                  val code = etInput.text.toString().trim()
                  if (code.length != 8) {
                      tvStatus.text = getString(R.string.err_length)
                      return
                  }
                  btnRing.isEnabled = false
                  tvStatus.text = getString(R.string.sending)
                  Thread {
                      val status = try { Api.ring(code) } catch (_: Exception) { -1 }
                      runOnUiThread {
                          btnRing.isEnabled = true
                          tvStatus.text = getString(
                              when (status) {
                                  200 -> R.string.sent
                                  404, 410 -> R.string.err_not_found
                                  429 -> R.string.err_wait
                                  -1 -> R.string.err_network
                                  else -> R.string.err_generic
                              }
                          )
                      }
                  }.start()
              }
          }
